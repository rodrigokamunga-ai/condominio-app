<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="theme-color" content="#117f75" />

  <title>
    Meu perfil - Amigos do Maui
  </title>

  <link rel="stylesheet" href="./styles.css?v=7" />
</head>

<body>

  <!-- CABEÇALHO -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">🏢</span>

      <div>
        <strong>
          Amigos do Maui
        </strong>

        <small>
          Meu perfil
        </small>
      </div>
    </div>


    <!-- MENU SUSPENSO -->
    <div class="top-menu-wrapper">
      <button id="btnMenu" class="menu-toggle" type="button" aria-expanded="false" aria-controls="mainMenu" >
        ☰ Menu
      </button>

      <nav id="mainMenu" class="top-menu hidden" aria-label="Menu principal" >
        <a href="./index.html" class="menu-link" >
          <span class="menu-icon">🏠</span>
          <span>Área do morador</span>
        </a>

        <a href="./public.html" class="menu-link" >
          <span class="menu-icon">📋</span>
          <span>Registros públicos</span>
        </a>

        

        <a href="./manual-portal-morador.pdf" class="menu-link" download="manual-portal-morador.pdf" >
          <span class="menu-icon">📖</span>
          <span>Manual do usuário</span>
        </a>

        <button id="btnLogout" class="menu-link" type="button" >
          <span class="menu-icon">🚪</span>
          <span>Sair</span>
        </button>
      </nav>
    </div>
  </header>


  <!-- CONTEÚDO PRINCIPAL -->
  <main class="container profile-container">

    <section class="card profile-card">

      <div class="section-heading">
        <div>
          <span class="eyebrow">
            DADOS DO USUÁRIO
          </span>

          <h1>
            Meu perfil
          </h1>

          <p class="muted">
            Atualize seus dados cadastrais.
          </p>
        </div>
      </div>


      <form id="profileForm" class="form" autocomplete="off" >

        <label>
          Nome completo *

          <input id="profileName" type="text" required minlength="3" maxlength="100" autocomplete="name" placeholder="Digite seu nome completo" />
        </label>


        <label>
          Unidade / apartamento *

          <input id="profileUnit" type="text" required maxlength="30" placeholder="Ex.: 200" />
        </label>


        <label>
          Bloco

          <input id="profileBlock" type="text" maxlength="30" placeholder="Ex.: 1" />
        </label>


        <label>
          Telefone

          <input id="profilePhone" type="tel" maxlength="30" autocomplete="tel" placeholder="(00) 00000-0000" />
        </label>


        <label>
          E-mail cadastrado

          <input id="profileEmail" type="email" readonly disabled />

          <small class="helper">
            Para alterar o e-mail, será necessário realizar
            uma validação adicional de segurança.
          </small>
        </label>


        <div class="profile-actions">
          <a href="./index.html" class="secondary-button button-link" >
            Cancelar
          </a>

          <button id="btnSaveProfile" class="primary-button" type="submit" >
            Salvar alterações
          </button>
        </div>


        <p id="profileMessage" class="message" ></p>

      </form>

    </section>
  </main>


  <!-- MODAL DE CONFIRMAÇÃO DE SAÍDA -->
  <div id="logoutModal" class="modal hidden" >
    <div class="modal-card logout-modal-card">

      <button id="btnCloseLogout" class="modal-close" type="button" aria-label="Fechar confirmação" >
        ×
      </button>

      <h2>
        Confirmar saída
      </h2>

      <p class="muted">
        Deseja realmente sair do sistema?
      </p>

      <div class="logout-actions">

        <button id="btnCancelLogout" class="secondary-button" type="button" >
          Cancelar
        </button>

        <button id="btnConfirmLogout" class="danger-button" type="button" >
          Sair do sistema
        </button>

      </div>
    </div>
  </div>


  <!-- NOTIFICAÇÃO -->
  <div id="toast" class="toast" ></div>


  <!-- JAVASCRIPT -->
  <script type="module" src="./perfil.js?v=3" ></script>

</body>
</html>
